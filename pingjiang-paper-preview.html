<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eae6dc">
  <link rel="icon" href="data:,">
  <title>水巷缓行 · 平江路动态明信片</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#ebe8df;color:#293e35;font-family:system-ui,-apple-system,"Microsoft Yahei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}header{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:24px 30px;border-bottom:1px solid #40504425}header a{color:inherit;text-decoration:none;font-family:serif;font-weight:700;letter-spacing:.2em}header span{font-size:10px;letter-spacing:.2em;color:#768074}main{max-width:1120px;margin:auto;padding:40px 30px 26px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;letter-spacing:.23em;color:#887453;margin:0 0 12px}h1{font-family:"Songti SC","SimSun",serif;font-size:clamp(32px,5vw,53px);font-weight:500;letter-spacing:.14em;margin:0}h1 span{font-size:.4em;letter-spacing:.1em;margin-left:13px}.intro>p{font-size:12px;line-height:1.9;color:#727a6e;margin:0}.stage{position:relative;margin-top:27px;height:min(65vh,640px);min-height:360px;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 50% 25%,#c5c8b3,#929f89 57%,#718470);box-shadow:0 28px 55px #263c2520}.stage:after{content:"";position:absolute;inset:11px;border:1px solid #f3e9cb55;border-radius:10px;pointer-events:none}.pingjiang-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.pingjiang-canvas:active{cursor:grabbing}.caption{position:absolute;bottom:25px;left:27px;pointer-events:none;color:#edf0db}.caption b{font-family:serif;font-size:18px;letter-spacing:.18em;font-weight:500}.caption p{font-size:9px;letter-spacing:.15em;opacity:.8}.badge{position:absolute;right:25px;top:24px;font-size:10px;color:#eff0db;letter-spacing:.15em}.actions{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:24px}.actions p{font-size:11px;color:#727a6e;line-height:1.7}button{border:1px solid #53664d4d;background:#f6f3e9;color:#344a3b;border-radius:30px;min-height:44px;padding:0 22px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}button:hover{background:#dedfcf}button:focus-visible,a:focus-visible{outline:3px solid #a17e47;outline-offset:4px}footer{max-width:1120px;margin:15px auto;padding:17px 30px;border-top:1px solid #40504425;font-size:10px;color:#7e8274;line-height:1.8}#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#f6f0d7;background:#66785ef0}#loading[hidden]{display:none}@media(max-width:600px){header{padding:20px}header span{font-size:8px;letter-spacing:.1em}main{padding:30px 15px 10px}.intro{display:block;padding:0 5px}.intro>p{margin-top:14px;font-size:11px}.stage{height:57vh;min-height:390px;margin-top:21px}.caption{left:20px;bottom:19px}.badge{right:19px;top:20px;font-size:9px}.actions{margin:16px 5px}.actions p{font-size:10px;max-width:190px}footer{margin:12px 20px;padding:15px 0;font-size:9px}}
  </style>
  <style>
    .scene-picker{display:flex;align-items:center;gap:13px;margin-top:23px;color:#727a6e;font-size:11px}
    .scene-picker select{min-height:44px;max-width:100%;flex:1;padding:0 13px;border:1px solid #53664d4d;border-radius:8px;background:#f6f3e9;color:#344a3b;font:inherit;font-size:12px}
    .scene-picker select:focus-visible{outline:3px solid #a17e47;outline-offset:3px}
    .scene-picker span{min-width:74px}
    .scene-picker+.stage{margin-top:18px}
    .actions{flex-wrap:wrap}.scene-controls{display:flex;gap:9px;flex-wrap:wrap}.scene-controls [aria-pressed="true"]{background:#344a3b;color:#faf5e7}
    @media(max-width:600px){.scene-picker{margin:20px 5px 0;gap:9px}}
  </style>
<style>.stage{aspect-ratio:1.5;height:auto;min-height:0;background:#ece8df;border-radius:12px}.caption{display:none}.badge{z-index:2;color:#59684e;background:#f8f4e9d9;padding:7px 11px;border-radius:20px}.intro>p{max-width:320px}#stage>.pingjiang-canvas{position:absolute!important;inset:0}</style></head>
<body>
  <header><a href="./">姑苏寻影</a><span>GUSU · A LIVING POSTCARD</span></header>
  <main>
    <div class="intro"><div><p class="eyebrow" id="scene-number">PINGJIANG / 层叠纸艺</p><h1><b id="scene-title" style="font-weight:inherit">水巷缓行</b><span id="scene-name">平江路</span></h1></div><p id="scene-description">白墙、灰瓦与一河慢时光。<br>一张缓缓展开的姑苏纸景。</p></div>
    
    <section class="stage" id="stage" aria-label="可拖动旋转的平江路立体场景">
      <div class="badge">轻轻拖动 · 细看纸层</div><div class="caption"><b>河岸生长，旧影成景。</b><p>PAPER, LIGHT & A QUIET WATERWAY</p></div><div id="loading" role="status">正在展开水巷…</div>
    </section>
    <div class="actions"><p>轻轻拖动，感受纸层间的视差。<br>也可以让小船停下，细看白墙与树影。</p><div class="scene-controls"><button id="detail" type="button" aria-pressed="false">让纸船停一停</button><button id="replay" type="button">重新展开 ↗</button></div></div>
  </main>
  <footer>平江路 · 分层纸艺动态样片<br>根据旧照构图进行艺术化设计。</footer>
  <script type="module">
import {createPaperPostcard} from './pingjiang-paper.js?v=2';
const stage=document.getElementById('stage');
const engine=createPaperPostcard(stage);
document.getElementById('loading').hidden=true;
document.getElementById('detail').onclick=e=>e.currentTarget.setAttribute('aria-pressed',String(engine.toggleDetail()));
document.getElementById('replay').onclick=()=>engine.replay();
window.addEventListener('pagehide',e=>e.persisted?engine.setVisible(false):engine.dispose());
window.addEventListener('pageshow',e=>{if(e.persisted)engine.setVisible(true)});
</script>
</body>
</html>
